<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سلم وثعبان الأمان</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,"Segoe UI",Arial,sans-serif;background:#0f5c4d;color:#fff;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:10px}
h1{font-size:1.4rem;text-align:center;margin:4px 0}
.hud{display:flex;justify-content:space-around;background:#157a66;border-radius:12px;padding:8px;font-size:1.05rem;text-align:center}
.hud b{display:block}.on{background:#ffca28;color:#222;border-radius:8px;padding:2px 10px}
#board{direction:ltr;display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin:10px 0;background:#fff3;padding:3px;border-radius:12px}
.c{aspect-ratio:1;background:#e8f5e9;color:#1b5e20;border-radius:8px;font-size:.75rem;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:bold}
.c.l{background:#c8e6c9}.c.s{background:#ffcdd2;color:#b71c1c}.c.f{background:#ffe082;color:#e65100}
.c .m{font-size:.8rem}.c .p{font-size:1.1rem;line-height:1}
button{font:inherit;font-size:1.05rem;border:0;border-radius:12px;padding:12px;background:#ffca28;color:#222;font-weight:bold;cursor:pointer;width:100%}
button:active{transform:scale(.97)}
#box{background:#157a66;border-radius:14px;padding:12px;text-align:center}
.q{font-size:1.1rem;margin:6px 0 10px}
.opts{display:grid;gap:8px}.opts button{background:#fff}
.ok{color:#9be564}.bad{color:#ff8a80}
.dice{font-size:2.4rem}
</style>
</head>
<body>
<div class="wrap">
<h1>🎲 سلم وثعبان الأمان</h1>
<div id="app"></div>
</div>
<script>
var L={3:11,6:17,14:22,20:27},S={16:8,24:12,29:18};
var Q=[
["زميل يرسل لك رسائل مسيئة باستمرار على الإنترنت. ماذا تفعل؟",["أرد بالإساءة","أعمل حظر (block) وأخبر معلمي أو أسرتي","أسكت وأتحمل"],1,"اعمل block واطلب المساعدة."],
["رسالة تطلب كلمة مرورك لتربح جائزة (تصيد إلكتروني).",["أكتبها","لا أكتبها وأخبر أسرتي","أرسلها لصديقي"],1,"التصيد يسرق بياناتك: لا تكتب شيئاً."],
["شخص يدّعي أنه من هيئة معروفة ويطلب تحويل أموال (انتحال هوية).",["أتجاهله وأخبر أسرتي","أحوّل المال","أعطيه بياناتي"],0,"لا تثق به وأخبر أسرتك."],
["شخص استخدم حسابك وصورك باسمك (سرقة هوية). من يساعدك؟",["جاري","إدارة مكافحة جرائم الإنترنت","لا أحد"],1,"يمكن تقديم شكوى لإدارة مكافحة جرائم الإنترنت."],
["غريب في الشات يسألك عن اسمك ومدرستك.",["أخبره بكل شيء","أعطيه عنواني","لا أشارك بياناتي وأعمل حظر له"],2,"لا تشارك بياناتك الشخصية مع المجهولين."],
["وصلتك رسالة إعلانية من بريد غير معروف (spam).",["أتجاهلها ولا أفتحها","أفتح الروابط","أرسلها للأصدقاء"],0,"الرسائل المزعجة تُتجاهل."],
["دخلت بالخطأ إلى موقع غير مناسب.",["أكمل التصفح","أترك الموقع وأخبر معلمي أو أسرتي","أخبر الغرباء"],1,"اترك الموقع وأخبر شخصاً بالغاً."],
["صديقك يتعرض للتنمر الإلكتروني وهو خائف.",["أضحك عليه","أنشر الرسائل","أشجعه على إخبار معلمه أو أسرته"],2,"المساعدة تبدأ بالتحدث إلى شخص بالغ موثوق."],
["ما هو التنمر الإلكتروني؟",["إرسال رسائل مسيئة بشكل متكرر","لعبة على الحاسب","برنامج لكتابة النصوص"],0,"هو الإساءة المتكررة عبر الإنترنت."],
["أي جهة تقدم المساعدة وتتخذ الإجراءات القانونية في جرائم الإنترنت؟",["مكتبة المدرسة","إدارة مكافحة جرائم الإنترنت","محل ألعاب"],1,"هي إدارة مكافحة جرائم الإنترنت."],
["ماذا تفعل بحسابك بعد الانتهاء من الاستخدام؟",["أتركه مفتوحاً","أغلقه وأغلق الجهاز","أعطي كلمة المرور لصديقي"],1,"أغلق حساباتك وأجهزتك لحمايتها."],
["وصلك رابط غريب مكتوب عليه: اضغط هنا الآن!",["أضغط فوراً","لا أضغط وأسأل معلمي أو أسرتي","أرسله للجميع"],1,"لا تضغط على روابط لست متأكداً منها."]
];
var app=document.getElementById("app"),pos,turn,deck,cur,dv,names=["🔵 الفريق الأزرق","🔴 الفريق الأحمر"],tk=["🔵","🔴"];
function newDeck(){deck=Q.slice().sort(function(){return Math.random()-.5})}
function intro(){app.innerHTML='<div id="box"><p>فريقان يتسابقان للوصول إلى الخانة 30.<br>أجب عن الموقف: الإجابة الصحيحة تصعدك السلم 🪜 والخاطئة تنزلك بالثعبان 🐍</p><button onclick="init()">ابدأ اللعب</button></div>'}
function init(){pos=[0,0];turn=0;newDeck();draw('<button onclick="roll()">🎲 ارمِ النرد</button>')}
function board(){
var h='';
for(var r=4;r>=0;r--)for(var k=0;k<6;k++){
var n=r*6+(r%2?5-k:k)+1,cls="c",m="";
if(L[n]){cls+=" l";m='<span class="m">🪜→'+L[n]+'</span>'}
if(S[n]){cls+=" s";m='<span class="m">🐍→'+S[n]+'</span>'}
if(n==30){cls+=" f";m='<span class="m">🏁</span>'}
var p=(pos[0]==n?tk[0]:"")+(pos[1]==n?tk[1]:"");
h+='<div class="'+cls+'">'+n+m+'<span class="p">'+p+'</span></div>'}
return h}
function draw(inner,msg){
app.innerHTML='<div class="hud"><span class="'+(turn==0?"on":"")+'">'+names[0]+'<b>خانة '+pos[0]+'</b></span><span class="'+(turn==1?"on":"")+'">'+names[1]+'<b>خانة '+pos[1]+'</b></span></div><div id="board">'+board()+'</div><div id="box">'+(msg||'<p>دور '+names[turn]+'</p>')+inner+'</div>'}
function roll(){
dv=1+Math.floor(Math.random()*6);
pos[turn]=Math.min(30,pos[turn]+dv);
if(!deck.length)newDeck();
cur=deck.pop();
var o=cur[1].map(function(x,i){return[x,i]}).sort(function(){return Math.random()-.5}),h='<div class="opts">';
o.forEach(function(x){h+='<button onclick="ans('+x[1]+')">'+x[0]+'</button>'});
draw(h+'</div>','<div class="dice">🎲 '+dv+'</div><div class="q">'+cur[0]+'</div>')}
function ans(i){
var ok=i==cur[2],p=pos[turn],note="";
if(ok){note='<span class="ok">✅ صحيح! '+cur[3]+'</span>';if(L[p]){pos[turn]=L[p];note+='<br>🪜 صعدت السلم إلى '+L[p]}}
else{note='<span class="bad">❌ إجابة خاطئة. '+cur[3]+'</span>';if(S[p]){pos[turn]=S[p];note+='<br>🐍 نزلت إلى '+S[p]}else{pos[turn]=Math.max(1,p-2);note+='<br>رجعت خانتين'}}
if(pos[turn]>=30){app.innerHTML='<div id="box"><div class="dice">🏆</div><h2>'+names[turn]+' فاز!</h2><p>بطل الأمان الرقمي: اطلب المساعدة دائماً من معلمك أو أسرتك.</p><button onclick="init()">العب مرة أخرى</button></div>';return}
turn=1-turn;
draw('<button onclick="roll()">🎲 ارمِ النرد</button>','<p>'+note+'</p><p>الدور على '+names[turn]+'</p>')}
intro();
</script>
</body>
</html>
